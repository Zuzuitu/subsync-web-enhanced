<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="SubSync2 synchronizes subtitle timing locally in your browser.">
  <title>SubSync2 — Subtitle Synchronizer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <script>
    var baseurl = "";
    var user_language = "en";
  </script>
  <script src="./scripts/subsync.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="site_header">
      <a class="brand" href="./" aria-label="SubSync2 home">
        <span class="brand_mark" aria-hidden="true">S2</span>
        <span>
          <strong>SubSync2</strong>
          <small>Subtitle Speech Synchronizer</small>
        </span>
      </a>
      <span class="local_badge">Local processing</span>
    </header>

    <main class="app_card" id="main_content" aria-live="polite"></main>

    <section class="privacy_note" aria-label="Privacy">
      <strong>Your media stays on your device.</strong>
      Video, audio and subtitles are processed in the browser. Language assets are downloaded only when needed.
    </section>

    <footer class="site_footer">
      <span>SubSync2 is based on SubSync by Michał Szymaniak (sc0ty).</span>
      <a href="https://github.com/sc0ty/subsync" rel="noopener noreferrer">Original project</a>
      <span>GNU GPL v3</span>
    </footer>
  </div>

  <noscript>SubSync2 requires JavaScript and WebAssembly.</noscript>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (error) {
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
