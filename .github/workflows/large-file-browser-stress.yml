name: Large-file Browser Stress

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "web/src/**"
      - "web/public/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "scripts/generate-web-metadata.py"
      - "scripts/stage-web-app.py"
      - "tests/web/run-large-file-stress.py"
      - "tests/fixtures/generate-large-mkv-stress.sh"
      - ".github/workflows/large-file-browser-stress.yml"
  push:
    branches:
      - "test/large-file-browser-stress"
    paths:
      - "tests/web/run-large-file-stress.py"
      - "tests/fixtures/generate-large-mkv-stress.sh"
      - ".github/workflows/large-file-browser-stress.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  browser-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current known-good authoritative WASM
        uses: actions/download-artifact@v4
        with:
          name: legacy-wasm
          path: web/scripts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34712143001

      - name: Verify downloaded WASM engine
        shell: bash
        run: |
          set -euxo pipefail
          test -s web/scripts/extractor.js
          test -s web/scripts/extractor.wasm
          test -s web/scripts/correlator.js
          test -s web/scripts/correlator.wasm
          test -s web/scripts/whisper.js
          test -s web/scripts/whisper.wasm
          sha256sum web/scripts/extractor.js web/scripts/extractor.wasm web/scripts/whisper.js web/scripts/whisper.wasm

      - name: Generate reproducible web metadata
        run: python3 scripts/generate-web-metadata.py --hash "$GITHUB_SHA" --version "2.0.0-dev"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned JavaScript dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build browser bundle
        working-directory: web
        run: npm run build

      - name: Stage PWA with pinned primary assets
        run: python3 scripts/stage-web-app.py --hash "$GITHUB_SHA"

      - name: Install stress-test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -m pip install --disable-pip-version-check             playwright==1.55.0             psutil==7.0.0
          python3 -m playwright install --with-deps chromium webkit

      - name: Generate >=128 MiB direct-MKV stress fixture
        run: bash tests/fixtures/generate-large-mkv-stress.sh

      - name: Stress direct MKV in Chromium
        env:
          SUBSYNC2_BROWSER_ENGINE: chromium
        run: python3 tests/web/run-large-file-stress.py

      - name: Stress direct MKV in iPhone-like WebKit
        env:
          SUBSYNC2_BROWSER_ENGINE: webkit
        run: python3 tests/web/run-large-file-stress.py

      - name: Upload large-file diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsync2-large-file-browser-stress
          path: |
            tests/generated/large-file-stress-chromium.json
            tests/generated/large-file-stress-webkit.json
            tests/generated/large-file-stress/fixture.json
          if-no-files-found: warn
          retention-days: 7
