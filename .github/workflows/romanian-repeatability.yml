name: Romanian Identical Input Study

on:
  push:
    branches:
      - "test/romanian-repeatability"
    paths:
      - "tests/fixtures/**"
      - "tests/web/**"
      - ".github/workflows/romanian-repeatability.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/fixtures/**"
      - "tests/web/**"
      - ".github/workflows/romanian-repeatability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identical-input:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser and Romanian fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check playwright==1.55.0 'piper-tts[http]==1.8.0'
          python3 -m playwright install --with-deps chromium

      - name: Prepare pinned Romanian fixture voice
        run: python3 tests/fixtures/prepare-romanian-piper-voice.py

      - name: Start pinned Romanian Piper fixture server
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m piper.http_server \
            -m ro_RO-mihai-medium \
            --data-dir tests/generated/romanian-piper \
            --host 127.0.0.1 \
            --port 5001 \
            > tests/generated/romanian-audio-e2e/piper-http.log 2>&1 &
          echo $! > tests/generated/romanian-audio-e2e/piper-http.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5001/info > tests/generated/romanian-audio-e2e/piper-info.json; then
              exit 0
            fi
            sleep 1
          done
          cat tests/generated/romanian-audio-e2e/piper-http.log
          exit 1

      - name: Compare independent syntheses and three fixed-input browser runs
        run: python3 tests/web/run-public-romanian-repeatability.py

      - name: Preserve exact synthetic input and every run, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsync2-romanian-repeatability
          path: |
            tests/generated/romanian-repeatability/
            tests/generated/romanian-audio-e2e/piper-fixture.json
            tests/generated/romanian-audio-e2e/piper-info.json
            tests/generated/romanian-audio-e2e/piper-http.log
          if-no-files-found: error
          retention-days: 7
