name: PWA Shell Fast Build

on:
  push:
    branches:
      - "feat/pwa-shell"
    paths:
      - "web/src/**"
      - "web/public/**"
      - "web/package.json"
      - "web/.gitignore"
      - "scripts/generate-web-metadata.py"
      - "scripts/stage-web-app.py"
      - "tests/web/**"
      - "config/english-romanian-assets.json"
      - ".github/workflows/pwa-shell-fast.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  web-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download known-good WASM from authoritative PR 5 run
        uses: actions/download-artifact@v4
        with:
          name: legacy-wasm
          path: web/scripts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34620017397

      - name: Verify WASM inputs
        shell: bash
        run: |
          set -euxo pipefail
          test -s web/scripts/extractor.js
          test -s web/scripts/extractor.wasm
          test -s web/scripts/correlator.js
          test -s web/scripts/correlator.wasm

      - name: Generate reproducible web metadata
        run: python3 scripts/generate-web-metadata.py --hash "$GITHUB_SHA" --version "2.0.0-dev"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install legacy web JavaScript dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build browser bundle
        working-directory: web
        run: npm run build

      - name: Stage PWA with pinned production-path assets
        run: python3 scripts/stage-web-app.py --hash "$GITHUB_SHA"

      - name: Install browser smoke runner
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          if ! command -v google-chrome >/dev/null \
             && ! command -v google-chrome-stable >/dev/null \
             && ! command -v chromium >/dev/null \
             && ! command -v chromium-browser >/dev/null; then
            python3 -m playwright install --with-deps chromium
          fi

      - name: Exercise staged PWA shell
        run: python3 tests/web/run-app-shell-smoke.py

      - name: Upload staged PWA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsync2-pwa-fast
          path: web/dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload PWA smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsync2-pwa-fast-diagnostics
          path: tests/generated/web-app-smoke.json
          if-no-files-found: warn
          retention-days: 7
