name: Romanian Speech PoC

on:
  push:
    branches:
      - "research/romanian-whisper-poc"
    paths:
      - "config/romanian-speech-poc.json"
      - ".github/workflows/romanian-speech-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout SubSync2 research branch
        uses: actions/checkout@v4

      - name: Load pinned Romanian speech inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cfg = json.loads(Path("config/romanian-speech-poc.json").read_text(encoding="utf-8"))
          fixture = cfg["fixture"]
          voice = fixture["voice"]
          values = {
              "WHISPER_CPP_SHA": cfg["whisperCpp"]["commit"],
              "WHISPER_MODEL_URL": cfg["model"]["url"],
              "WHISPER_MODEL_SHA256": cfg["model"]["sha256"],
              "WHISPER_MODEL_NAME": cfg["model"]["name"],
              "WHISPER_LANGUAGE": cfg["model"]["language"],
              "ROMANIAN_TTS_TEXT": fixture["text"],
              "PIPER_PACKAGE": fixture["piperPackage"],
              "PIPER_VOICE_NAME": voice["name"],
              "PIPER_MODEL_URL": voice["modelUrl"],
              "PIPER_CONFIG_URL": voice["configUrl"],
              "PIPER_MODEL_SHA256": voice["modelSha256"],
              "PIPER_CONFIG_MD5": voice["configMd5"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key, value in values.items():
                  print(f"{key}={value}", file=f)
          PY

      - name: Install local PoC dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ffmpeg
          python3 -m pip install --disable-pip-version-check "$PIPER_PACKAGE"

      - name: Checkout pinned whisper.cpp
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/whisper.cpp
          git init /tmp/whisper.cpp
          git -C /tmp/whisper.cpp remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C /tmp/whisper.cpp fetch --depth 1 origin "$WHISPER_CPP_SHA"
          git -C /tmp/whisper.cpp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/whisper.cpp rev-parse HEAD)" = "$WHISPER_CPP_SHA"

      - name: Build pinned whisper.cpp CLI
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S /tmp/whisper.cpp -B /tmp/whisper-build -G Ninja             -DWHISPER_BUILD_EXAMPLES=ON             -DWHISPER_BUILD_TESTS=OFF
          cmake --build /tmp/whisper-build --target whisper-cli -j2
          test -x /tmp/whisper-build/bin/whisper-cli

      - name: Download and verify pinned multilingual model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tests/generated
          curl --fail --location --retry 5 --retry-delay 3             "$WHISPER_MODEL_URL"             --output "tests/generated/ggml-$WHISPER_MODEL_NAME.bin"
          echo "$WHISPER_MODEL_SHA256  tests/generated/ggml-$WHISPER_MODEL_NAME.bin"             | sha256sum --check
          sha256sum "tests/generated/ggml-$WHISPER_MODEL_NAME.bin"             | tee tests/generated/whisper-model.sha256

      - name: Download and verify pinned Romanian Piper voice
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-delay 3             "$PIPER_MODEL_URL"             --output "tests/generated/$PIPER_VOICE_NAME.onnx"
          curl --fail --location --retry 5 --retry-delay 3             "$PIPER_CONFIG_URL"             --output "tests/generated/$PIPER_VOICE_NAME.onnx.json"

          echo "$PIPER_MODEL_SHA256  tests/generated/$PIPER_VOICE_NAME.onnx"             | sha256sum --check
          echo "$PIPER_CONFIG_MD5  tests/generated/$PIPER_VOICE_NAME.onnx.json"             | md5sum --check

          sha256sum             "tests/generated/$PIPER_VOICE_NAME.onnx"             "tests/generated/$PIPER_VOICE_NAME.onnx.json"             | tee tests/generated/piper-voice.sha256

      - name: Generate neural Romanian speech fixture
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m piper             --data-dir tests/generated             -m "$PIPER_VOICE_NAME"             -f tests/generated/romanian-piper.wav             -- "$ROMANIAN_TTS_TEXT"

          ffmpeg -hide_banner -loglevel error -y             -i tests/generated/romanian-piper.wav             -ar 16000 -ac 1 -c:a pcm_s16le             tests/generated/romanian-16k.wav

          ffprobe -v error             -show_entries stream=codec_name,sample_rate,channels:format=duration             -of json tests/generated/romanian-16k.wav             | tee tests/generated/romanian-audio.json

      - name: Transcribe Romanian fixture
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/whisper-build/bin/whisper-cli             -m "tests/generated/ggml-$WHISPER_MODEL_NAME.bin"             -f tests/generated/romanian-16k.wav             -l "$WHISPER_LANGUAGE"             -ojf             -of tests/generated/romanian-whisper             2>&1 | tee tests/generated/romanian-whisper.log
          test -s tests/generated/romanian-whisper.json

      - name: Validate Romanian recognition and timing output
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import unicodedata
          from pathlib import Path

          cfg = json.loads(Path("config/romanian-speech-poc.json").read_text(encoding="utf-8"))
          result = json.loads(Path("tests/generated/romanian-whisper.json").read_text(encoding="utf-8"))

          transcription = result.get("transcription", [])
          text = " ".join(segment.get("text", "") for segment in transcription)

          def normalize_words(value):
              value = unicodedata.normalize("NFD", value.lower())
              value = "".join(ch for ch in value if unicodedata.category(ch) != "Mn")
              return set(re.findall(r"[a-z]+", value))

          recognized = normalize_words(text)
          expected = set(cfg["fixture"]["expectedNormalizedWords"])
          matched = sorted(recognized & expected)
          minimum = cfg["fixture"]["minimumExpectedWords"]

          timed_segments = 0
          timed_tokens = 0
          for segment in transcription:
              if segment.get("offsets"):
                  timed_segments += 1
              for token in segment.get("tokens", []):
                  if token.get("offsets"):
                      timed_tokens += 1

          payload = {
              "recognizedText": text.strip(),
              "matchedWords": matched,
              "expectedWords": sorted(expected),
              "minimumExpectedWords": minimum,
              "timedSegments": timed_segments,
              "timedTokens": timed_tokens,
              "model": cfg["model"]["name"],
              "language": cfg["model"]["language"],
              "whisperCppCommit": cfg["whisperCpp"]["commit"],
              "fixtureProvider": cfg["fixture"]["provider"],
              "fixtureVoice": cfg["fixture"]["voice"]["name"],
          }

          Path("tests/generated/romanian-poc-result.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, ensure_ascii=False))

          if len(matched) < minimum:
              raise SystemExit(
                  f"Romanian recognition too weak for PoC: matched {len(matched)} / {len(expected)}"
              )
          if timed_segments < 1:
              raise SystemExit("Whisper PoC produced no timed transcription segments")
          if timed_tokens < 1:
              raise SystemExit("Whisper PoC produced no token timing output")
          PY

      - name: Upload Romanian speech PoC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: romanian-whisper-poc
          path: |
            tests/generated/romanian-poc-result.json
            tests/generated/romanian-whisper.log
            tests/generated/romanian-whisper.json
            tests/generated/romanian-audio.json
            tests/generated/whisper-model.sha256
            tests/generated/piper-voice.sha256
          if-no-files-found: warn
          retention-days: 7
