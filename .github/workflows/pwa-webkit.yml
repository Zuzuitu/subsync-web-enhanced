name: PWA WebKit Compatibility

on:
  push:
    branches:
      - "test/webkit-pwa-compatibility"
    paths:
      - "web/src/**"
      - "web/public/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "scripts/generate-web-metadata.py"
      - "scripts/stage-web-app.py"
      - "tests/web/**"
      - "tests/fixtures/**"
      - "config/english-romanian-assets.json"
      - ".github/workflows/pwa-webkit.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/src/**"
      - "web/public/**"
      - "tests/web/**"
      - ".github/workflows/pwa-webkit.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  webkit-primary-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROWSER_ENGINE: webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download known-good WebAssembly engine
        uses: actions/download-artifact@v4
        with:
          name: legacy-wasm
          path: web/scripts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34645451836

      - name: Verify WebAssembly inputs
        shell: bash
        run: |
          set -euxo pipefail
          test -s web/scripts/extractor.js
          test -s web/scripts/extractor.wasm
          test -s web/scripts/correlator.js
          test -s web/scripts/correlator.wasm

      - name: Install deterministic fixture dependencies
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -m pip install --disable-pip-version-check 'piper-tts[http]==1.8.0'

      - name: Prepare pinned English Romanian assets and voice
        run: |
          python3 tests/fixtures/prepare-en-ro-assets.py
          python3 tests/fixtures/prepare-piper-fixture-voice.py

      - name: Start pinned Piper fixture server
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m piper.http_server \
            -m en_US-joe-medium \
            --data-dir tests/generated/piper \
            --host 127.0.0.1 \
            --port 5000 \
            > tests/generated/en-ro-e2e/piper-http-webkit.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/info > tests/generated/en-ro-e2e/piper-info-webkit.json; then
              exit 0
            fi
            sleep 1
          done
          cat tests/generated/en-ro-e2e/piper-http-webkit.log
          exit 1

      - name: Generate English audio and Romanian subtitle fixture
        run: python3 tests/fixtures/generate-en-ro-e2e.py

      - name: Generate reproducible web metadata
        run: python3 scripts/generate-web-metadata.py --hash "$GITHUB_SHA" --version "2.0.0-dev"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned JavaScript dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build browser application
        working-directory: web
        run: npm run build

      - name: Stage PWA with pinned assets
        run: python3 scripts/stage-web-app.py --hash "$GITHUB_SHA"

      - name: Install Playwright WebKit
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps webkit

      - name: Exercise PWA shell in WebKit
        run: python3 tests/web/run-app-shell-smoke.py

      - name: Exercise English audio Romanian subtitles through WebKit
        run: python3 tests/web/run-primary-workflow.py

      - name: Upload WebKit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsync2-webkit-diagnostics
          path: |
            tests/generated/web-app-smoke-webkit.json
            tests/generated/web-primary-workflow-webkit.json
            tests/generated/web-primary-workflow-output-webkit.srt
            tests/generated/en-ro-e2e/piper-http-webkit.log
          if-no-files-found: warn
          retention-days: 7
