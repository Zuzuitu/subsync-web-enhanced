name: Legacy WebAssembly Build

concurrency:
  group: legacy-wasm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "gizmo/**"
      - "web/**"
      - "config/legacy-build-pins.json"
      - "config/test-fixture-pins.json"
      - "config/english-romanian-assets.json"
      - "config/romanian-asr.json"
      - "config/sc0ty-assets-public-key.pem"
      - "scripts/generate-web-metadata.py"
      - "scripts/mirror-upstream-assets.py"
      - "scripts/prepare-whisper-single-thread.py"
      - "scripts/stage-web-app.py"
      - ".github/workflows/legacy-web-build.yml"
      - "tests/wasm/**"
      - "tests/fixtures/**"
      - "tests/web/**"
  push:
    branches:
      - "chore/legacy-wasm-build"
    paths:
      - "gizmo/**"
      - "web/**"
      - "config/legacy-build-pins.json"
      - "config/test-fixture-pins.json"
      - "config/english-romanian-assets.json"
      - ".github/workflows/legacy-web-build.yml"

permissions:
  contents: read

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load pinned build inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pins = json.loads(Path("config/legacy-build-pins.json").read_text())
          romanian_asr = json.loads(Path("config/romanian-asr.json").read_text())
          values = {
              "FFMPEG_REF": pins["ffmpeg"]["ref"],
              "SPHINXBASE_SHA": pins["sphinxbase"]["sha"],
              "POCKETSPHINX_SHA": pins["pocketsphinx"]["sha"],
              "WHISPERCPP_SHA": pins["whispercpp"]["sha"],
              "EMSCRIPTEN_VERSION": pins["emscripten"]["version"],
              "ROMANIAN_ASR_IMAGE": romanian_asr["toolchain"]["image"],
              "ROMANIAN_ASR_EMSCRIPTEN_VERSION": romanian_asr["toolchain"]["version"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key, value in values.items():
                  print(f"{key}={value}", file=f)
          PY

      - name: Restore pinned native dependency build
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: web/deps
          key: legacy-wasm-deps-${{ runner.os }}-${{ hashFiles('config/legacy-build-pins.json', 'web/Makefile') }}

      - name: Prepare pinned native dependency sources
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p web/node_modules

          git clone --depth 1 --branch "$FFMPEG_REF" https://github.com/FFmpeg/FFmpeg.git web/node_modules/ffmpeg

          git -C web/node_modules init sphinxbase-tmp
          git -C web/node_modules/sphinxbase-tmp remote add origin https://github.com/cmusphinx/sphinxbase.git
          git -C web/node_modules/sphinxbase-tmp fetch --depth 1 origin "$SPHINXBASE_SHA"
          git -C web/node_modules/sphinxbase-tmp checkout --detach FETCH_HEAD
          mv web/node_modules/sphinxbase-tmp web/node_modules/sphinxbase

          git -C web/node_modules init pocketsphinx-tmp
          git -C web/node_modules/pocketsphinx-tmp remote add origin https://github.com/cmusphinx/pocketsphinx.git
          git -C web/node_modules/pocketsphinx-tmp fetch --depth 1 origin "$POCKETSPHINX_SHA"
          git -C web/node_modules/pocketsphinx-tmp checkout --detach FETCH_HEAD
          mv web/node_modules/pocketsphinx-tmp web/node_modules/pocketsphinx

          git -C web/node_modules init whispercpp-tmp
          git -C web/node_modules/whispercpp-tmp remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C web/node_modules/whispercpp-tmp fetch --depth 1 origin "$WHISPERCPP_SHA"
          git -C web/node_modules/whispercpp-tmp checkout --detach FETCH_HEAD
          mv web/node_modules/whispercpp-tmp web/node_modules/whispercpp

          test "$(git -C web/node_modules/sphinxbase rev-parse HEAD)" = "$SPHINXBASE_SHA"
          test "$(git -C web/node_modules/pocketsphinx rev-parse HEAD)" = "$POCKETSPHINX_SHA"
          test "$(git -C web/node_modules/whispercpp rev-parse HEAD)" = "$WHISPERCPP_SHA"
          test "$(git -C web/node_modules/ffmpeg describe --tags --exact-match)" = "$FFMPEG_REF"

      - name: Build pinned Emscripten toolchain image
        run: docker build --pull -t subsync-web-build web

      - name: Record compiler version
        run: |
          test "$(docker run --rm subsync-web-build emcc --version | head -n1 | awk '{print $NF}')" = "$EMSCRIPTEN_VERSION"
          docker run --rm subsync-web-build emcc --version
          docker run --rm subsync-web-build em++ --version

      - name: Build extractor and correlator WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm             -v "$GITHUB_WORKSPACE:/src"             -w /src/web             subsync-web-build             emmake make -j4

      - name: Save pinned native dependency build after compile
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/deps
          key: legacy-wasm-deps-${{ runner.os }}-${{ hashFiles('config/legacy-build-pins.json', 'web/Makefile') }}

      - name: Prepare pinned Romanian Whisper source
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -d web/node_modules/whispercpp/.git ]; then
            rm -rf web/node_modules/whispercpp web/node_modules/whispercpp-tmp
            mkdir -p web/node_modules
            git -C web/node_modules init whispercpp-tmp
            git -C web/node_modules/whispercpp-tmp remote add origin https://github.com/ggml-org/whisper.cpp.git
            git -C web/node_modules/whispercpp-tmp fetch --depth 1 origin "$WHISPERCPP_SHA"
            git -C web/node_modules/whispercpp-tmp checkout --detach FETCH_HEAD
            mv web/node_modules/whispercpp-tmp web/node_modules/whispercpp
          fi
          test "$(git -C web/node_modules/whispercpp rev-parse HEAD)" = "$WHISPERCPP_SHA"
          python3 scripts/prepare-whisper-single-thread.py \
            --source web/node_modules/whispercpp \
            --destination web/deps/src/whispercpp

      - name: Build pinned Romanian Whisper SIMD toolchain
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$ROMANIAN_ASR_IMAGE"
          docker tag "$ROMANIAN_ASR_IMAGE" subsync-whisper-build
          docker run --rm subsync-whisper-build emcc --version | head -n1 | grep -F "$ROMANIAN_ASR_EMSCRIPTEN_VERSION"
          docker run --rm subsync-whisper-build emcc --version

      - name: Build isolated Romanian Whisper SIMD WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src/web \
            subsync-whisper-build \
            emmake make -f Makefile.whisper -j4

      - name: Verify WebAssembly artifacts
        shell: bash
        run: |
          set -euxo pipefail
          test -s web/scripts/extractor.js
          test -s web/scripts/extractor.wasm
          test -s web/scripts/correlator.js
          test -s web/scripts/correlator.wasm
          test -s web/scripts/whisper.js
          test -s web/scripts/whisper.wasm
          sha256sum \
            web/scripts/extractor.js \
            web/scripts/extractor.wasm \
            web/scripts/correlator.js \
            web/scripts/correlator.wasm \
            web/scripts/whisper.js \
            web/scripts/whisper.wasm \
            | tee web/scripts/SHA256SUMS

      - name: Assert browser WebAssembly modules do not require shared memory
        run: |
          python3 tests/wasm/assert-unshared-memory.py web/scripts/extractor.wasm
          python3 tests/wasm/assert-unshared-memory.py web/scripts/whisper.wasm

      - name: Verify Romanian Whisper SIMD runtime
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src/web \
            subsync-whisper-build \
            node - <<'NODE'
          const factory = require('./scripts/whisper.js');
          factory().then(module => {
            const recognition = new module.RomanianWhisperRecognition();
            const info = recognition.systemInfo();
            console.log(info);
            recognition.delete();
            if (!info.includes('WASM_SIMD = 1')) {
              throw new Error('Romanian Whisper module did not report WASM SIMD support');
            }
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Generate deterministic MKV + Romanian SRT fixtures
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          bash tests/fixtures/generate-mkv-smoke.sh

      - name: Prepare pinned sc0ty speech fixture
        run: python3 tests/fixtures/prepare-sc0ty-speech-model.py

      - name: Install browser smoke test runner
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          if ! command -v google-chrome >/dev/null              && ! command -v google-chrome-stable >/dev/null              && ! command -v chromium >/dev/null              && ! command -v chromium-browser >/dev/null; then
            python3 -m playwright install --with-deps chromium
          fi

      - name: Exercise canonical MKV matrix and Romanian SRT through browser WASM
        env:
          SUBSYNC2_STRICT_SEEK: "1"
        run: python3 tests/wasm/run-browser-smoke.py

      - name: Install pinned neural fixture voice runtime
        run: python3 -m pip install --disable-pip-version-check 'piper-tts[http]==1.8.0'

      - name: Prepare pinned English Romanian production-path assets
        run: |
          python3 tests/fixtures/prepare-en-ro-assets.py
          python3 tests/fixtures/prepare-piper-fixture-voice.py

      - name: Start pinned Piper fixture server
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m piper.http_server \
            -m en_US-joe-medium \
            --data-dir tests/generated/piper \
            --host 127.0.0.1 \
            --port 5000 \
            > tests/generated/en-ro-e2e/piper-http.log 2>&1 &
          echo $! > tests/generated/en-ro-e2e/piper-http.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/info > tests/generated/en-ro-e2e/piper-info.json; then
              exit 0
            fi
            sleep 1
          done
          cat tests/generated/en-ro-e2e/piper-http.log
          exit 1

      - name: Generate English audio and offset Romanian subtitles
        run: python3 tests/fixtures/generate-en-ro-e2e.py

      - name: Exercise English audio Romanian subtitles end to end
        run: python3 tests/wasm/run-en-ro-e2e.py

      - name: Generate reproducible web metadata
        run: python3 scripts/generate-web-metadata.py --hash "$GITHUB_SHA" --version "2.0.0-dev"

      - name: Reset native dependency workspace before npm ci
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf web/node_modules

      - name: Set up Node for browser application
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install legacy web JavaScript dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build browser application bundle
        working-directory: web
        run: npm run build

      - name: Stage installable PWA with pinned assets
        run: python3 scripts/stage-web-app.py --hash "$GITHUB_SHA"

      - name: Exercise staged PWA shell
        run: python3 tests/web/run-app-shell-smoke.py

      - name: Exercise language asset progress and cache management
        run: python3 tests/web/run-language-cache-ux.py

      - name: Exercise pinned upstream language assets on demand
        run: python3 tests/web/run-upstream-assets-smoke.py

      - name: Exercise primary workflow through real PWA UI
        run: python3 tests/web/run-primary-workflow.py

      - name: Prepare pinned Romanian fixture voice
        run: python3 tests/fixtures/prepare-romanian-piper-voice.py

      - name: Start pinned Romanian Piper fixture server
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m piper.http_server \
            -m ro_RO-mihai-medium \
            --data-dir tests/generated/romanian-piper \
            --host 127.0.0.1 \
            --port 5001 \
            > tests/generated/romanian-audio-e2e/piper-http.log 2>&1 &
          echo $! > tests/generated/romanian-audio-e2e/piper-http.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5001/info > tests/generated/romanian-audio-e2e/piper-info.json; then
              exit 0
            fi
            sleep 1
          done
          cat tests/generated/romanian-audio-e2e/piper-http.log
          exit 1

      - name: Generate Romanian audio and offset Romanian subtitles
        run: python3 tests/fixtures/generate-romanian-audio-e2e.py

      - name: Exercise Romanian audio through real PWA UI
        run: python3 tests/web/run-romanian-audio-workflow.py --browser chromium

      - name: Install Playwright WebKit for Romanian ASR regression
        run: python3 -m playwright install --with-deps webkit

      - name: Exercise Romanian audio with iPhone-like WebKit
        run: python3 tests/web/run-romanian-audio-workflow.py --browser webkit


      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legacy-wasm
          path: |
            web/scripts/extractor.js
            web/scripts/extractor.wasm
            web/scripts/correlator.js
            web/scripts/correlator.wasm
            web/scripts/whisper.js
            web/scripts/whisper.wasm
            web/scripts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload MKV smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkv-wasm-smoke-diagnostics
          path: |
            tests/generated/browser-wasm-smoke.json
            tests/generated/speech-ita.sha256
            tests/generated/speech-model/manifest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload English Romanian E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-audio-romanian-subs-e2e
          path: |
            tests/generated/en-ro-e2e/browser-en-ro-e2e.json
            tests/generated/en-ro-e2e/fixture.json
            tests/generated/en-ro-e2e/asset-metadata.json
            tests/generated/en-ro-e2e/piper-fixture.json
            tests/generated/en-ro-e2e/piper-info.json
            tests/generated/en-ro-e2e/piper-http.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload authoritative PWA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsync2-pwa-authoritative
          path: web/dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload PWA browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsync2-pwa-diagnostics
          path: |
            tests/generated/web-app-smoke.json
            tests/generated/web-language-cache-ux.json
            tests/generated/web-upstream-assets-smoke.json
            tests/generated/web-primary-workflow.json
            tests/generated/web-primary-workflow-output.srt
            tests/generated/romanian-audio-e2e/chromium-romanian-audio.json
            tests/generated/romanian-audio-e2e/chromium-output.rum.srt
            tests/generated/romanian-audio-e2e/webkit-romanian-audio.json
            tests/generated/romanian-audio-e2e/webkit-output.rum.srt
            tests/generated/romanian-audio-e2e/fixture.json
            tests/generated/romanian-audio-e2e/piper-fixture.json
            tests/generated/romanian-audio-e2e/piper-info.json
            tests/generated/romanian-audio-e2e/piper-http.log
          if-no-files-found: warn
          retention-days: 7
