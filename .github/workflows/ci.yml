name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "bootstrap/**"
      - "fix/**"
      - "feat/**"
      - "chore/**"
      - "perf/**"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical project state and invariants
        run: python3 scripts/verify-project-invariants.py
      - name: Validate public smoke diagnostic persistence
        run: |
          python3 -m unittest discover -s tests/web -p "test_*.py"
          python3 -m unittest discover -s tests/fixtures -p "test_*.py"
          node tests/js/correlation-rpc-capture.js
      - name: Validate Romanian language aliases
        run: node tests/js/language-codes.js
      - name: Validate Romanian sparse-window planner
        run: node tests/js/romanian-windows.js
      - name: Validate Romanian lexical context anchors
        run: node tests/js/romanian-context-anchors.js
      - name: Validate Romanian adaptive convergence
        run: node tests/js/romanian-convergence.js
      - name: Validate Romanian post-lock precision refinement
        run: node tests/js/romanian-precision.js
      - name: Validate canonical correlation status selection
        run: node tests/js/correlation-status.js
      - name: Validate Romanian adaptive save policy
        run: node tests/js/save-policy.js
      - name: Validate read-only timing review and diagnostic privacy
        run: node tests/js/timing-review.js
      - name: Validate legacy web package metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("web/package.json")
          data = json.loads(p.read_text())
          assert data["license"] == "GPL-3.0-or-later"
          assert data["napa"]["ffmpeg"] == "FFmpeg/FFmpeg#n4.2"
          print("Legacy web baseline metadata: OK")
          PY
