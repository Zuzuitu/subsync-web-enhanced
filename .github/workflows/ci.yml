name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "bootstrap/**"
      - "fix/**"
      - "feat/**"
      - "chore/**"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical project state and invariants
        run: python3 scripts/verify-project-invariants.py
      - name: Validate Romanian language aliases
        run: node tests/js/language-codes.js
      - name: Validate legacy web package metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("web/package.json")
          data = json.loads(p.read_text())
          assert data["license"] == "GPL-3.0-or-later"
          assert data["napa"]["ffmpeg"] == "FFmpeg/FFmpeg#n4.2"
          print("Legacy web baseline metadata: OK")
          PY
