name: Deploy PWA Preview

on:
  workflow_dispatch:
  push:
    branches:
      - "deploy/pages-preview"

concurrency:
  group: subsync2-pages-preview
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/legacy-web-build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: subsync2-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download authoritative PWA artifact
        uses: actions/download-artifact@v4
        with:
          name: subsync2-pwa-authoritative
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
