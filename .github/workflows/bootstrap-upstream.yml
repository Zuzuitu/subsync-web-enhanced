name: Bootstrap upstream baseline

on:
  push:
    branches:
      - bootstrap/subsync2-foundation
    paths:
      - .github/workflows/bootstrap-upstream.yml

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SubSync2 branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap/subsync2-foundation
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import pinned sc0ty/SubSync baseline
        env:
          UPSTREAM_SHA: c888da7257d57bf039523c9f7015feacb4b95dc3
        run: |
          git remote add upstream https://github.com/sc0ty/subsync.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          git archive "$UPSTREAM_SHA" | tar -x
          printf '%s\n' "$UPSTREAM_SHA" > UPSTREAM_COMMIT
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to import."
            exit 0
          fi
          git commit -m "chore: import sc0ty/SubSync upstream baseline"
          git push origin HEAD:bootstrap/subsync2-foundation
