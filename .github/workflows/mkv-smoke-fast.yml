name: MKV WASM Fast Diagnostic

on:
  push:
    branches:
      - "test/mkv-wasm-reproduction"
    paths:
      - "tests/wasm/**"
      - "tests/fixtures/**"
      - ".github/workflows/mkv-smoke-fast.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Download known-good WASM engine from PR #2
        uses: actions/download-artifact@v4
        with:
          name: legacy-wasm
          path: web/scripts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34564019526

      - name: Verify downloaded engine
        shell: bash
        run: |
          set -euxo pipefail
          test -s web/scripts/extractor.js
          test -s web/scripts/extractor.wasm
          test -s web/scripts/correlator.js
          test -s web/scripts/correlator.wasm
          sha256sum web/scripts/extractor.js web/scripts/extractor.wasm

      - name: Generate deterministic MKV + SRT fixtures
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          bash tests/fixtures/generate-mkv-smoke.sh

      - name: Prepare original sc0ty Italian speech model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tests/generated
          curl --fail --location --retry 3 \
            https://github.com/sc0ty/subsync/releases/download/assets/speech-ita.zip \
            --output tests/generated/speech-ita.zip
          sha256sum tests/generated/speech-ita.zip | tee tests/generated/speech-ita.sha256

          rm -rf tests/generated/speech-model
          mkdir -p tests/generated/speech-model
          unzip -q tests/generated/speech-ita.zip -d tests/generated/speech-model

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("tests/generated/speech-model")
          files = sorted(
              str(path.relative_to(root)).replace("\\", "/")
              for path in root.rglob("*")
              if path.is_file()
          )
          speech = [path for path in files if path.endswith(".speech")]
          if len(speech) != 1:
              raise SystemExit(f"Expected one .speech descriptor, found {speech}")

          manifest = {
              "source": "sc0ty/subsync release asset speech-ita.zip",
              "releaseAssetId": 14727504,
              "descriptor": speech[0],
              "files": files,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2))
          print((root / speech[0]).read_text(encoding="utf-8"))
          PY

      - name: Install browser smoke test runner
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          if ! command -v google-chrome >/dev/null \
             && ! command -v google-chrome-stable >/dev/null \
             && ! command -v chromium >/dev/null \
             && ! command -v chromium-browser >/dev/null; then
            python3 -m playwright install --with-deps chromium
          fi

      - name: Compare MKV and extracted audio through full speech pipeline
        run: python3 tests/wasm/run-browser-smoke.py

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkv-wasm-fast-diagnostics
          path: |
            tests/generated/browser-wasm-smoke.json
            tests/generated/speech-ita.sha256
            tests/generated/speech-model/manifest.json
          if-no-files-found: warn
          retention-days: 7
